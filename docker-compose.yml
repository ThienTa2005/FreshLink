services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-freshlink_db}
      MYSQL_USER: ${MYSQL_USER:-freshlink}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-freshlink_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-freshlink_root_dev}
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - freshlink_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-freshlink_root_dev}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-freshlink_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-freshlink}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-freshlink_dev}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-freshlink/evidence}
      CLOUDINARY_ACCESS_SECONDS: ${CLOUDINARY_ACCESS_SECONDS:-300}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-3}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-0}
      BOOTSTRAP_ENABLED: ${BOOTSTRAP_ENABLED:-false}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  freshlink_mysql_data:
