services:
  - type: web
    name: freshlink-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_FOLDER
        value: freshlink/evidence
      - key: CLOUDINARY_ACCESS_SECONDS
        value: "300"
      - key: DB_MAX_POOL_SIZE
        value: "3"
      - key: DB_MIN_IDLE
        value: "0"
      - key: BOOTSTRAP_ENABLED
        value: "false"
      - key: DEMO_ENABLED
        value: "false"
